# SportEdge Pro — development stack.
# Production stack lives in docker-compose.prod.yml (step 15).

services:
  postgres:
    image: postgres:16-alpine
    container_name: sportedge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportedge}
      POSTGRES_USER: ${POSTGRES_USER:-sportedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportedge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed on 5433 to avoid clashing with a host-side Postgres on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportedge} -d ${POSTGRES_DB:-sportedge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sportedge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportedge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sportedge}
      POSTGRES_USER: ${POSTGRES_USER:-sportedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportedge}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL:-you@example.com}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-change-on-first-login}
      DEFAULT_STARTING_BANKROLL: ${DEFAULT_STARTING_BANKROLL:-1000.00}
    volumes:
      # Mount source for hot-reload. Excludes any host-built artefacts.
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Obsidian vault — host path comes from .env, defaults to ./obsidian-vault
      - ${OBSIDIAN_VAULT_PATH:-./obsidian-vault}:/vault
    ports:
      - "8000:8000"
    networks:
      - sportedge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportedge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/public:/app/public
      # Anonymous volume so node_modules from the image isn't shadowed by the host.
      - /app/node_modules
    ports:
      # Expose Vite on 80 so http://localhost works straight after `compose up`.
      - "80:5173"
    networks:
      - sportedge-net

volumes:
  postgres_data:
    name: sportedge-postgres-data

networks:
  sportedge-net:
    name: sportedge-net
    driver: bridge
