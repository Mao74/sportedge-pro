name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: pytest + ruff lint
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportedge
          POSTGRES_PASSWORD: sportedge
          POSTGRES_DB: sportedge
        options: >-
          --health-cmd "pg_isready -U sportedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      ENABLE_SCHEDULER: "false"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sportedge
      POSTGRES_USER: sportedge
      POSTGRES_PASSWORD: sportedge
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-prod
      DEFAULT_USER_EMAIL: ci@example.com
      DEFAULT_USER_PASSWORD: ci-password-not-secret
      DEFAULT_STARTING_BANKROLL: "1000.00"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest -ra --tb=short

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

  # ---------------------------------------------------------------------------
  # Frontend: typecheck + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Vite build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build
